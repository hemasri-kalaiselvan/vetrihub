<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VetriHub</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#20242f" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="VetriHub" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #20242f; --surface: #262b38; --surface-2: #2f3543;
    --border: rgba(255,255,255,0.08); --text: #f1efe7; --text-dim: #9aa0b0;
    --accent: #ffb454; --accent-dim: rgba(255,180,84,0.14);
    --danger: #ff7a6e; --danger-dim: rgba(255,122,110,0.14);
    --radius: 14px; --shadow: 0 12px 32px rgba(0,0,0,0.35);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin: 0; padding: 0; background: var(--bg); }
  body{ min-height: 100vh; color: var(--text); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #app{ width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
  .vh-header{ position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .vh-burger{ background: none; border: none; color: var(--text); cursor: pointer; padding: 6px; margin: -6px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-radius: 8px; }
  .vh-burger:hover{ background: var(--surface); }
  .vh-burger span{ display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
  .vh-title{ font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.2px; }

  .vh-scrim{ position: fixed; inset: 0; background: rgba(10,11,15,0.55); z-index: 30; animation: fade .15s ease; }
  .vh-drawer{ position: fixed; top: 0; left: 0; bottom: 0; width: 78%; max-width: 300px; background: var(--surface); z-index: 31; box-shadow: var(--shadow); padding: 22px 0; display: flex; flex-direction: column; animation: slidein .18s ease; }
  @keyframes slidein{ from{ transform: translateX(-100%); } to{ transform: translateX(0); } }
  @keyframes fade{ from{ opacity: 0; } to{ opacity: 1; } }
  .vh-drawer-title{ font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; padding: 0 22px 18px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .vh-drawer-item{ background: none; border: none; color: var(--text); text-align: left; font-family: 'Inter', sans-serif; font-size: 15.5px; font-weight: 500; padding: 13px 22px; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; }
  .vh-drawer-item:hover:not(.disabled), .vh-drawer-item.active{ background: var(--surface-2); color: var(--accent); }
  .vh-drawer-item.disabled{ color: var(--text-dim); cursor: default; }
  .vh-drawer-divider{ border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .vh-lock-icon{ display: flex; opacity: 0.7; }

  .vh-main{ flex: 1; padding: 8px 20px 40px; }

  .vh-home-list{ margin-top: 10px; display: flex; flex-direction: column; }
  .vh-home-link{ display: flex; align-items: center; justify-content: space-between; background: none; border: none; border-bottom: 1px solid var(--border); padding: 22px 4px; width: 100%; cursor: pointer; color: var(--text); }
  .vh-home-link:hover .vh-home-name{ color: var(--accent); }
  .vh-home-name{ font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 600; transition: color .15s ease; display: flex; align-items: center; gap: 6px; }
  .vh-home-link-disabled{ opacity: 0.45; cursor: default; }
  .vh-home-link-disabled:hover .vh-home-name{ color: var(--text); }
  .vh-arrow{ color: var(--text-dim); font-size: 18px; display:flex; }

  .vh-section-row{ display: flex; align-items: center; gap: 12px; margin-top: 14px; margin-bottom: 18px; }
  .vh-section-title{ font-family: 'Sora', sans-serif; font-weight: 700; font-size: 22px; display:flex; align-items:center; gap:8px; }
  .vh-plus{ position: relative; width: 30px; height: 30px; border-radius: 9px; border: none; background: var(--accent-dim); color: var(--accent); font-size: 19px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .vh-plus:hover{ background: var(--accent); color: #23272f; }
  .vh-plus:disabled{ opacity: 0.5; cursor: default; }
  .vh-plus-active{ background: var(--accent); color: #23272f; }
  .vh-plus-badge{ position: absolute; top: -6px; right: -6px; background: var(--danger); color: #2a1414; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .vh-pending-badge{ display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-dim); border-radius: 6px; padding: 2px 7px; margin-left: 4px; vertical-align: middle; }
  .vh-filter-note{ color: var(--text-dim); font-size: 12.5px; margin: -6px 0 14px; }

  .vh-table-wrap{ border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .vh-table-scroll{ max-height: 62vh; overflow-y: auto; position: relative; }
  table.vh-table{ width: 100%; border-collapse: collapse; font-size: 14px; }
  .vh-table thead th{ position: sticky; top: 0; z-index: 5; background: var(--surface-2); color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; font-size: 11px; font-weight: 600; text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
  .vh-table td{ padding: 13px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .vh-table tr:last-child td{ border-bottom: none; }
  .vh-actions-cell{ display: flex; gap: 6px; }
  .vh-icon-btn{ background: none; border: none; cursor: pointer; color: var(--text-dim); padding: 6px; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .vh-icon-btn:hover{ background: var(--surface-2); color: var(--text); }
  .vh-icon-btn:disabled{ opacity: 0.4; cursor: default; }
  .vh-icon-btn.danger:hover{ color: var(--danger); background: var(--danger-dim); }
  .vh-empty{ padding: 34px 10px; text-align: center; color: var(--text-dim); font-size: 14px; }

  .vh-search{ width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14.5px; outline: none; margin-bottom: 16px; }
  .vh-search:focus{ border-color: var(--accent); }
  .vh-search::placeholder{ color: var(--text-dim); }

  .vh-recipe-item{ border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; overflow: hidden; }
  .vh-recipe-head{ display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; cursor: pointer; }
  .vh-recipe-name{ font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15.5px; flex: 1; padding-right: 10px; }
  .vh-recipe-right{ display: flex; align-items: center; gap: 2px; }
  .vh-chevron{ color: var(--text-dim); transition: transform .15s ease; display: flex; }
  .vh-chevron.open{ transform: rotate(180deg); }
  .vh-recipe-body{ padding: 0 16px 16px; color: var(--text-dim); font-size: 14px; line-height: 1.6; white-space: pre-wrap; border-top: 1px solid var(--border); padding-top: 14px; }

  .vh-rte-toolbar{ display: flex; gap: 4px; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--border); border-bottom: none; border-radius: 10px 10px 0 0; padding: 6px; }
  .vh-rte-btn{ background: none; border: none; color: var(--text-dim); width: 30px; height: 30px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .vh-rte-btn:hover{ background: var(--surface); color: var(--text); }
  .vh-rte-btn.active{ background: var(--accent-dim); color: var(--accent); }
  .vh-rte-select{ background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 7px; font-size: 12.5px; padding: 0 6px; font-family: 'Inter', sans-serif; }
  .vh-rte-editor{ min-height: 180px; max-height: 40vh; overflow-y: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 0 0 10px 10px; padding: 12px 13px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14.5px; line-height: 1.55; outline: none; }
  .vh-rte-editor:empty:before{ content: attr(data-placeholder); color: var(--text-dim); }
  .vh-rte-editor h1{ font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; margin: 10px 0 6px; }
  .vh-rte-editor h2{ font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; margin: 10px 0 6px; }
  .vh-rte-editor h3{ font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; margin: 8px 0 5px; }
  .vh-rte-editor blockquote{ border-left: 3px solid var(--accent); margin: 8px 0; padding: 4px 0 4px 12px; color: var(--text-dim); font-style: italic; }
  .vh-rte-editor ul{ margin: 6px 0; padding-left: 20px; }
  .vh-rte-editor p{ margin: 0 0 8px; }

  .vh-situation-body h1{ font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; margin: 14px 0 7px; color: var(--text); }
  .vh-situation-body h2{ font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; margin: 14px 0 6px; color: var(--text); }
  .vh-situation-body h3{ font-family: 'Sora', sans-serif; font-size: 14.5px; font-weight: 600; margin: 12px 0 5px; color: var(--text); }
  .vh-situation-body blockquote{ border-left: 3px solid var(--accent); margin: 10px 0; padding: 4px 0 4px 12px; color: var(--text); font-style: italic; }
  .vh-situation-body ul{ margin: 8px 0; padding-left: 20px; }
  .vh-situation-body p{ margin: 0 0 10px; }
  .vh-situation-body{ padding: 0 16px 16px; color: var(--text-dim); font-size: 14px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 14px; }

  .vh-modal-scrim{ position: fixed; inset: 0; background: rgba(10,11,15,0.6); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
  @media (min-width: 520px){ .vh-modal-scrim{ align-items: center; } }
  .vh-modal{ width: 100%; max-width: 440px; background: var(--surface); border-radius: 18px 18px 0 0; padding: 22px 20px 26px; border: 1px solid var(--border); animation: slideup .18s ease; }
  @media (min-width: 520px){ .vh-modal{ border-radius: 18px; } }
  @keyframes slideup{ from{ transform: translateY(16px); opacity: .6; } to{ transform: translateY(0); opacity: 1; } }
  .vh-modal-title{ font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 18px; }
  .vh-field{ margin-bottom: 16px; }
  .vh-field label{ display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .vh-field input, .vh-field textarea{ width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14.5px; outline: none; }
  .vh-field input:focus, .vh-field textarea:focus{ border-color: var(--accent); }
  .vh-field input[type="date"], .vh-field input[type="time"]{ color-scheme: dark; }
  .vh-field textarea{ min-height: 120px; resize: vertical; font-family: 'Inter', sans-serif; }
  .vh-field-error{ color: var(--danger); font-size: 12px; margin-top: 6px; }
  .vh-modal-actions{ display: flex; gap: 10px; margin-top: 6px; }
  .vh-btn{ flex: 1; padding: 12px 14px; border-radius: 10px; border: none; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .vh-btn-cancel{ background: var(--surface-2); color: var(--text); }
  .vh-btn-cancel:hover{ background: #3a4152; }
  .vh-btn-save{ background: var(--accent); color: #23272f; }
  .vh-btn-save:hover{ opacity: .9; }
  .vh-btn-save:disabled{ opacity: .5; cursor: default; }
  .vh-btn-delete{ background: var(--danger); color: #2a1414; }
  .vh-btn-delete:hover{ opacity: .9; }
  .vh-btn-delete:disabled{ opacity: .5; cursor: default; }
  .vh-confirm-text{ color: var(--text-dim); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

  .vh-toast{ position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 13.5px; padding: 11px 18px; border-radius: 10px; z-index: 60; box-shadow: var(--shadow); animation: fade .15s ease; max-width: 90%; text-align: center; }
  .vh-debug-btn{ position: fixed; right: 14px; bottom: 14px; z-index: 55; background: var(--danger); color: #2a1414; border: none; border-radius: 20px; padding: 9px 14px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; box-shadow: var(--shadow); cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */
const CONFIG = {
  CLIENT_ID: "892601484439-nn48q1qat3at8fbnjd4cg2560paspkel.apps.googleusercontent.com",
  API_KEY: "AIzaSyCJ2wDNsisPoIpQPMtOV9aWUhByg6k1qOQ",
  OWNER_EMAIL: "vsks5587@gmail.com",
  SHEET_ID: "1hF9fvZHvw36xN8pM2qWnbOPvtYu7VY77zUuGBIw0F8I",
  // Single source of truth for ALL recipes, complete or title-only/pending.
  // Which ones show is purely a view-level decision (see loadRecipesPublic) —
  // signed-in owner sees everything, public visitors see only complete ones.
  RECIPES_SHEET_ID: "1ilV64YdLT8JuJm6j4bdrKFBXJ-gJMrOmW1wHsdAUTMU",
  // Write-only mirror doc — app writes a readable copy here for reference/sharing,
  // but never reads recipe data back from it.
  DOC_ID: "1ZrJ9oqR5uhNVhU3s1fBzz1bCi7a3OlZkcjAy1o3WGJY",
  // Situations & Solutions — public read, owner write, same pattern as Recipes.
  SITUATIONS_SHEET_ID: "1Uq6395_IOm8KgHQTC58ElHiPEXfeCanSCkVMa7OM_tQ",
  SCOPES: "openid email https://www.googleapis.com/auth/drive.file"
};

/* =========================================================
   Icons
========================================================= */
const ICON = {
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
  chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  lock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  pending: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  list: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  bold: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></svg>',
  italic: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>',
  underline: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="5" y1="20" x2="19" y2="20"/></svg>',
  quote: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h4v4a4 4 0 0 1-4 4v2a6 6 0 0 0 6-6V7Z"/><path d="M15 7h4v4a4 4 0 0 1-4 4v2a6 6 0 0 0 6-6V7Z"/></svg>',
  ulist: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>'
};

/* =========================================================
   Date / text helpers
========================================================= */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function toDateObj(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function formatDate(iso){ if(!iso) return "—"; const dt = toDateObj(iso); return `${MONTHS[dt.getMonth()]} ${String(dt.getDate()).padStart(2,"0")}, ${dt.getFullYear()}`; }
function diffDays(a,b){ return Math.round((toDateObj(a) - toDateObj(b)) / 86400000); }
function addDays(iso, days){ const dt = toDateObj(iso); dt.setDate(dt.getDate()+days); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }
function formatTime(t){ if(!t) return ""; const [h,min] = t.split(":").map(Number); const period = h>=12?"PM":"AM"; const h12 = h%12===0?12:h%12; return `${h12}:${String(min).padStart(2,"0")} ${period}`; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ const d=document.createElement("div"); d.textContent = s==null?"":s; return d.innerHTML; }

/* =========================================================
   State
========================================================= */
const state = {
  screen: "home",
  drawerOpen: false,
  signedIn: false,
  accessToken: null,
  sheetId: localStorage.getItem("vetrihub_sheet_id") || CONFIG.SHEET_ID || "",
  recipesSheetId: localStorage.getItem("vetrihub_recipes_sheet_id") || CONFIG.RECIPES_SHEET_ID || "",
  situationsSheetId: localStorage.getItem("vetrihub_situations_sheet_id") || CONFIG.SITUATIONS_SHEET_ID || "",
  docId: localStorage.getItem("vetrihub_doc_id") || CONFIG.DOC_ID || "",
  cycles: [],
  cyclesLoading: false,
  recipes: [],
  recipesLoading: true,
  recipeViewFilter: "all",
  bulkAddMode: false,
  situations: [],
  situationsLoading: true,
  situationForm: null,
  situationDeleteId: null,
  situationExpandedId: null,
  situationQuery: "",
  cycleForm: null,
  cycleDeleteId: null,
  recipeForm: null,
  recipeDeleteId: null,
  recipeExpandedId: null,
  recipeQuery: "",
  toast: null,
  saving: false,
  debugLogs: []
};

let toastTimer = null;
function setState(patch){ Object.assign(state, patch); render(); }
function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 2800);
}

/* On-screen error/diagnostic log — only visible to the signed-in owner. No computer needed to debug. */
const _origConsoleError = console.error.bind(console);
console.error = (...args) => {
  _origConsoleError(...args);
  const line = args.map(a => {
    if(a instanceof Error) return a.message;
    if(typeof a === "object"){ try{ return JSON.stringify(a); }catch(e){ return String(a); } }
    return String(a);
  }).join(" ");
  state.debugLogs = [...state.debugLogs, "[error] " + line].slice(-30);
  renderDebugButton();
};
const _origConsoleLog = console.log.bind(console);
console.log = (...args) => {
  _origConsoleLog(...args);
  const line = args.map(a => String(a)).join(" ");
  if(line.startsWith("VetriHub:")){
    state.debugLogs = [...state.debugLogs, "[info] " + line].slice(-30);
    renderDebugButton();
  }
};
function renderDebugButton(){
  let btn = document.getElementById("debugBtn");
  if(!state.signedIn || state.debugLogs.length === 0){ if(btn) btn.remove(); return; }
  if(!btn){
    btn = document.createElement("button");
    btn.id = "debugBtn";
    btn.className = "vh-debug-btn";
    btn.onclick = showDebugPanel;
    document.body.appendChild(btn);
  }
  btn.textContent = "Errors (" + state.debugLogs.length + ")";
}
function showDebugPanel(){
  document.getElementById("debugPanelScrim")?.remove();
  const scrim = document.createElement("div");
  scrim.id = "debugPanelScrim";
  scrim.className = "vh-modal-scrim";

      <div class="vh-modal-actions">

        <button class="vh-btn vh-btn-save" id="debugCloseBtn">Close</button>

/* =========================================================
   Google Sign-In — full-page redirect flow
   (Reliable inside installed/standalone PWAs, unlike popup-based sign-in.)
========================================================= */
function redirectUri(){
  return window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
}
function buildAuthUrl(prompt){
  const params = new URLSearchParams({
    client_id: CONFIG.CLIENT_ID,
    redirect_uri: redirectUri(),
    response_type: "token",
    scope: CONFIG.SCOPES,
    include_granted_scopes: "true",
    prompt: prompt
  });
  return "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
}
function parseHashParams(){
  const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(hash);
  const out = {};
  for(const [k,v] of params.entries()) out[k] = v;
  return out;
}
function clearHash(){
  history.replaceState(null, "", window.location.pathname + window.location.search);
}

function signIn(){
  sessionStorage.setItem("vetrihub_auth_mode", "explicit");
  window.location.href = buildAuthUrl("select_account consent");
}
function signOut(){
  localStorage.removeItem("vetrihub_was_signed_in");
  sessionStorage.removeItem("vetrihub_token");
  sessionStorage.removeItem("vetrihub_token_exp");
  sessionStorage.setItem("vetrihub_screen", "home");
  setState({ signedIn: false, accessToken: null, cycles: [], screen: state.screen === "cycle" ? "home" : state.screen });
}
function cacheToken(token, expiresInSeconds){
  sessionStorage.setItem("vetrihub_token", token);
  const expiresAt = Date.now() + (Math.max(60, (expiresInSeconds || 3600) - 60) * 1000);
  sessionStorage.setItem("vetrihub_token_exp", String(expiresAt));
}
function getCachedToken(){
  const token = sessionStorage.getItem("vetrihub_token");
  const exp = parseInt(sessionStorage.getItem("vetrihub_token_exp") || "0", 10);
  return (token && Date.now() < exp) ? token : null;
}

async function verifyAndSignIn(token, expiresInSeconds){
  try{
    const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + token }
    });
    if(!r.ok){ throw new Error("userinfo failed: " + r.status); }
    const info = await r.json();
    const email = (info.email || "").toLowerCase();
    if(email !== CONFIG.OWNER_EMAIL.toLowerCase()){
      localStorage.removeItem("vetrihub_was_signed_in");
      setState({ signedIn: false, accessToken: null });
      showToast("No access.");
      return;
    }
    localStorage.setItem("vetrihub_was_signed_in", "1");
    cacheToken(token, expiresInSeconds);
    setState({ signedIn: true, accessToken: token });
    await ensureAppFiles(token);
    await organizeFilesIntoFolder(token);
    await loadCycles();
  }catch(e){
    console.error("VetriHub: verifyAndSignIn error", e);
    showToast("Sign-in error. Try again.");
  }
}

/* Only runs the first time each file is missing — normally a no-op once IDs are hardcoded. */
async function ensureAppFiles(token){
  if(state.sheetId && state.recipesSheetId && state.situationsSheetId && state.docId) return;
  const authHeader = { Authorization: "Bearer " + token };
  let created = false;

  if(!state.sheetId){
    const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ properties: { title: "VetriHub Cycles" } })
    });
    if(!res.ok){ console.error("VetriHub: sheet create failed", res.status, await res.text()); showToast("Couldn't create Cycles sheet."); return; }
    const data = await res.json();
    state.sheetId = data.spreadsheetId;
    localStorage.setItem("vetrihub_sheet_id", state.sheetId);
    created = true;
  }

  if(!state.recipesSheetId){
    const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ properties: { title: "VetriHub Recipes Data" } })
    });
    if(!res.ok){ console.error("VetriHub: recipes sheet create failed", res.status, await res.text()); showToast("Couldn't create Recipes sheet."); return; }
    const data = await res.json();
    state.recipesSheetId = data.spreadsheetId;
    localStorage.setItem("vetrihub_recipes_sheet_id", state.recipesSheetId);
    const permRes = await fetch(`https://www.googleapis.com/drive/v3/files/${state.recipesSheetId}/permissions`, {
      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ role: "reader", type: "anyone" })
    });
    if(!permRes.ok){ console.error("VetriHub: recipes sheet share failed", permRes.status, await permRes.text()); showToast("Couldn't make Recipes sheet public."); }
    const headerRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.recipesSheetId}/values/Sheet1!A1:C1?valueInputOption=RAW`, {
      method: "PUT",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ range: "Sheet1!A1:C1", majorDimension: "ROWS", values: [["ID","Name","Instructions"]] })
    });
    if(!headerRes.ok){ console.error("VetriHub: recipes sheet header write failed", headerRes.status, await headerRes.text()); }
    created = true;
  }

  if(!state.situationsSheetId){
    const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ properties: { title: "VetriHub Situations Data" } })
    });
    if(!res.ok){ console.error("VetriHub: situations sheet create failed", res.status, await res.text()); showToast("Couldn't create Situations sheet."); return; }
    const data = await res.json();
    state.situationsSheetId = data.spreadsheetId;
    localStorage.setItem("vetrihub_situations_sheet_id", state.situationsSheetId);
    const permRes = await fetch(`https://www.googleapis.com/drive/v3/files/${state.situationsSheetId}/permissions`, {
      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ role: "reader", type: "anyone" })
    });
    if(!permRes.ok){ console.error("VetriHub: situations sheet share failed", permRes.status, await permRes.text()); showToast("Couldn't make Situations sheet public."); }
    const headerRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.situationsSheetId}/values/Sheet1!A1:C1?valueInputOption=RAW`, {
      method: "PUT",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ range: "Sheet1!A1:C1", majorDimension: "ROWS", values: [["ID","Title","Content"]] })
    });
    if(!headerRes.ok){ console.error("VetriHub: situations sheet header write failed", headerRes.status, await headerRes.text()); }
    created = true;
  }

  if(!state.docId){
    const res = await fetch("https://docs.googleapis.com/v1/documents", {
      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },
      body: JSON.stringify({ title: "VetriHub Recipes" })
    });
    if(!res.ok){ console.error("VetriHub: doc create failed", res.status, await res.text()); showToast("Couldn't create Recipes doc."); return; }
    const data = await res.json();
    state.docId = data.documentId;
    localStorage.setItem("vetrihub_doc_id", state.docId);

      method: "POST",
      headers: { ...authHeader, "Content-Type": "application/json" },

  }

  if(created){
    alert(
      "VetriHub created its files.\n\n" +

/* Moves all four app files into a single "VetriHub" folder in Drive, so
   they're not scattered loose at the top level. Runs once — a localStorage
   flag skips it on every later sign-in. */
async function organizeFilesIntoFolder(token){
  if(localStorage.getItem("vetrihub_files_organized") === "1") return;
  if(!state.sheetId || !state.recipesSheetId || !state.situationsSheetId || !state.docId) return;
  const authHeader = { Authorization: "Bearer " + token };
  try{
    let folderId = localStorage.getItem("vetrihub_folder_id");
    if(!folderId){
      const res = await fetch("https://www.googleapis.com/drive/v3/files", {
        method: "POST",
        headers: { ...authHeader, "Content-Type": "application/json" },
        body: JSON.stringify({ name: "VetriHub", mimeType: "application/vnd.google-apps.folder" })
      });
      if(!res.ok){ console.error("VetriHub: folder create failed", res.status, await res.text()); return; }
      const data = await res.json();
      folderId = data.id;
      localStorage.setItem("vetrihub_folder_id", folderId);
    }

    const fileIds = [state.sheetId, state.recipesSheetId, state.situationsSheetId, state.docId];
    for(const fileId of fileIds){
      const metaRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=parents`, { headers: authHeader });
      if(!metaRes.ok){ console.error("VetriHub: couldn't read parents for", fileId, metaRes.status); continue; }
      const meta = await metaRes.json();
      const oldParents = (meta.parents || []).join(",");
      const moveRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${folderId}${oldParents ? "&removeParents=" + oldParents : ""}`, {
        method: "PATCH",
        headers: authHeader
      });
      if(!moveRes.ok){ console.error("VetriHub: couldn't move file into folder", fileId, moveRes.status, await moveRes.text()); }
    }
    localStorage.setItem("vetrihub_files_organized", "1");
    console.log("VetriHub: all files organized into VetriHub folder " + folderId);
  }catch(e){
    console.error("VetriHub: organizeFilesIntoFolder error", e);
  }
}

function applySavedScreen(){
  const saved = sessionStorage.getItem("vetrihub_screen");
  if(saved === "cycle" && !state.signedIn) return; // stay on default rather than showing a locked screen unexpectedly
  if(saved === "home" || saved === "cycle" || saved === "recipe" || saved === "situations") state.screen = saved;
}

async function boot(){
  console.log("VetriHub: resolved IDs — sheetId=" + state.sheetId +
    " recipesSheetId=" + state.recipesSheetId + " (from " +
    (localStorage.getItem("vetrihub_recipes_sheet_id") ? "localStorage" : "CONFIG") +
    ") docId=" + state.docId);
  const params = parseHashParams();
  const authMode = sessionStorage.getItem("vetrihub_auth_mode");
  sessionStorage.removeItem("vetrihub_auth_mode");

  if(params.access_token){
    clearHash();
    await verifyAndSignIn(params.access_token, parseInt(params.expires_in || "3600", 10));
    applySavedScreen();
    render();
    await loadRecipesPublic();
    await loadSituationsPublic();
    return;
  }
  if(params.error){
    clearHash();
    if(authMode === "explicit") showToast("Sign-in was cancelled.");
    applySavedScreen();
    render();
    await loadRecipesPublic();
    await loadSituationsPublic();
    return;
  }
  const cached = getCachedToken();
  if(cached && localStorage.getItem("vetrihub_was_signed_in") === "1"){
    setState({ signedIn: true, accessToken: cached });
    await loadCycles();
    applySavedScreen();
    render();
    await loadRecipesPublic();
    await loadSituationsPublic();
    return;
  }
  if(localStorage.getItem("vetrihub_was_signed_in") === "1"){
    sessionStorage.setItem("vetrihub_auth_mode", "silent");
    window.location.href = buildAuthUrl("none");
    return;
  }
  applySavedScreen();
  render();
  await loadRecipesPublic();
  await loadSituationsPublic();
}

/* =========================================================
   Google Sheets — Cycle Tracker (private, owner only)
========================================================= */
function sheetsBase(){ return `https://sheets.googleapis.com/v4/spreadsheets/${state.sheetId}`; }

async function loadCycles(){
  if(!state.accessToken || !state.sheetId) return;
  setState({ cyclesLoading: true });
  try{
    const res = await fetch(`${sheetsBase()}/values/Sheet1!A2:B1000`, {
      headers: { Authorization: "Bearer " + state.accessToken },
      cache: "no-store"
    });
    if(!res.ok){
      const body = await res.text();
      console.error("VetriHub: Sheets read failed", res.status, body);
      throw new Error("sheet read failed: " + res.status);
    }
    const data = await res.json();
    const rows = data.values || [];
    state.cycles = rows.filter(r => r[0]).map(r => ({ id: uid(), date: r[0], time: r[1] || "" }));
  }catch(e){
    console.error("VetriHub: loadCycles error", e);
    showToast("Couldn't load cycles — check Errors log.");
  }
  setState({ cyclesLoading: false });
}

async function saveCyclesToSheet(nextCycles){
  if(!state.accessToken || !state.sheetId) return;
  setState({ saving: true });
  try{
    const clearRes = await fetch(`${sheetsBase()}/values/Sheet1:clear`, {
      method: "POST",
      headers: { Authorization: "Bearer " + state.accessToken }
    });
    if(!clearRes.ok){
      const body = await clearRes.text();
      console.error("VetriHub: Sheets clear failed", clearRes.status, body);
      throw new Error("sheet clear failed: " + clearRes.status);
    }
    const rows = computeRowsWithGaps(nextCycles);
    const values = [
      ["Date","Time","Gap (days)","Expected Next"],
      ...rows.map(r => [r.date, r.time || "", r.gap != null ? String(r.gap) : "", r.expectedNext ? formatDate(r.expectedNext) : ""])
    ];
    const updateRes = await fetch(`${sheetsBase()}/values/Sheet1!A1:D${values.length}?valueInputOption=RAW`, {
      method: "PUT",
      headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
      body: JSON.stringify({ range: `Sheet1!A1:D${values.length}`, majorDimension: "ROWS", values })
    });
    if(!updateRes.ok){
      const body = await updateRes.text();
      console.error("VetriHub: Sheets update failed", updateRes.status, body);
      throw new Error("sheet update failed: " + updateRes.status);
    }
    state.cycles = nextCycles;
  }catch(e){
    console.error("VetriHub: saveCyclesToSheet error", e);
    showToast("Couldn't save to Sheet — check Errors log.");
  }
  setState({ saving: false });
}

/* =========================================================
   Recipes — PRIMARY storage is a Google Sheet (public read, owner write),
   same reliable mechanism already used for Cycle Tracker. The Google Doc
   is a WRITE-ONLY mirror kept purely for the owner to view/share directly
   in Google Docs — the app never reads recipe data back from it.
========================================================= */
function recipesSheetsBase(){ return `https://sheets.googleapis.com/v4/spreadsheets/${state.recipesSheetId}`; }

function rowsToRecipes(rows){
  return (rows || [])
    .filter(r => r[1])
    .map(r => ({ id: r[0] || uid(), name: r[1] || "", instructions: r[2] || "" }));
}

async function loadRecipesPublic(){
  if(!state.recipesSheetId){
    setState({ recipes: [], recipesLoading: false });
    return;
  }
  setState({ recipesLoading: true });
  try{
    const url = state.accessToken
      ? `${recipesSheetsBase()}/values/Sheet1!A2:C1000`
      : `${recipesSheetsBase()}/values/Sheet1!A2:C1000?key=${CONFIG.API_KEY}`;
    const res = await fetch(url, state.accessToken
      ? { headers: { Authorization: "Bearer " + state.accessToken }, cache: "no-store" }
      : { cache: "no-store" });
    if(!res.ok){
      const body = await res.text();
      console.error("VetriHub: Recipes sheet read failed", res.status, body);
      throw new Error("recipes sheet read failed: " + res.status);
    }
    const data = await res.json();
    const all = rowsToRecipes(data.values);
    // View-level only: owner sees everything (complete + pending titles),
    // public visitors see only recipes that actually have instructions.
    state.recipes = state.signedIn ? all : all.filter(r => r.instructions.trim() !== "");
    console.log("VetriHub: loadRecipesPublic loaded " + state.recipes.length + " recipes (signedIn=" + state.signedIn + ")");
  }catch(e){
    state.recipes = state.recipes || [];
    console.error("VetriHub: loadRecipesPublic error", e);
    showToast("Couldn't load recipes — check Errors log.");
  }
  setState({ recipesLoading: false });
}

/* All recipe mutations are funneled through this single queue — belt and
   braces against any residual overlap within one open session. */
let recipeOpQueue = Promise.resolve();
function queueRecipeOp(fn){
  const run = recipeOpQueue.then(fn, fn);
  recipeOpQueue = run.catch(() => {});
  return run;
}

/* Read WITH row numbers (absolute Sheet1 row, header = row 1) so edit/delete
   can target one exact row instead of rewriting the whole sheet. */
async function fetchRecipeRowsIndexed(){
  const res = await fetch(`${recipesSheetsBase()}/values/Sheet1!A2:C1000`, {
    headers: { Authorization: "Bearer " + state.accessToken },
    cache: "no-store"
  });
  if(!res.ok){
    const body = await res.text();
    console.error("VetriHub: Recipes sheet read failed", res.status, body);
    throw new Error("recipes sheet read failed: " + res.status);
  }
  const data = await res.json();
  const rows = data.values || [];
  return rows
    .map((r, idx) => ({ rowNumber: idx + 2, id: r[0] || "", name: r[1] || "", instructions: r[2] || "" }))
    .filter(r => r.name);
}

/* ADD — a pure atomic append. No read of existing data at all, so it is
   physically impossible for this to overwrite or race against anything
   already in the sheet. */
function addRecipe(name, instructions){
  return queueRecipeOp(async () => {
    if(!state.accessToken || !state.recipesSheetId) return;
    setState({ saving: true });
    try{
      const recipe = { id: uid(), name, instructions: instructions || "" };
      const res = await fetch(`${recipesSheetsBase()}/values/Sheet1!A2:C:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
        method: "POST",
        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ values: [[recipe.id, recipe.name, recipe.instructions]] })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: recipe append failed", res.status, body);
        throw new Error("recipe append failed: " + res.status);
      }
      state.recipes = [recipe, ...state.recipes];
      console.log("VetriHub: recipe appended — now " + state.recipes.length + " in memory");
      await refreshMirrorBestEffort();
    }catch(e){
      console.error("VetriHub: addRecipe error", e);
      showToast("Couldn't save recipe — check Errors log.");
    }
    setState({ saving: false });
  });
}

/* Parses "Title\nInstructions...\n\nTitle2\n\nTitle3\nMore text" — blocks
   separated by one or more blank lines; first line of each block is the
   name, remaining lines (if any) are the instructions. */
function parseBulkRecipeText(text){
  return text
    .split(/\n\s*\n/)
    .map(block => block.trim())
    .filter(Boolean)
    .map(block => {
      const lines = block.split("\n");
      const name = lines[0].replace(/[:：]\s*$/, "").trim();
      const instructions = lines.slice(1).join("\n").trim();
      return { name, instructions };
    })
    .filter(r => r.name);
}

/* ADD MULTIPLE — one single atomic append call carrying every new row at
   once. Still can't race against existing data, same as the single-add path. */
function addRecipesBulk(entries){
  return queueRecipeOp(async () => {
    if(!state.accessToken || !state.recipesSheetId || entries.length === 0) return;
    setState({ saving: true });
    try{
      const newRecipes = entries.map(e => ({ id: uid(), name: e.name, instructions: e.instructions || "" }));
      const values = newRecipes.map(r => [r.id, r.name, r.instructions]);
      const res = await fetch(`${recipesSheetsBase()}/values/Sheet1!A2:C:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
        method: "POST",
        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ values })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: bulk recipe append failed", res.status, body);
        throw new Error("bulk recipe append failed: " + res.status);
      }
      state.recipes = [...newRecipes, ...state.recipes];
      console.log("VetriHub: bulk-added " + newRecipes.length + " recipes — now " + state.recipes.length + " in memory");
      await refreshMirrorBestEffort();
    }catch(e){
      console.error("VetriHub: addRecipesBulk error", e);
      showToast("Couldn't save recipes — check Errors log.");
    }
    setState({ saving: false });
  });
}

/* EDIT — find the one matching row, update only that row's range. */
function editRecipe(id, name, instructions){
  return queueRecipeOp(async () => {
    if(!state.accessToken || !state.recipesSheetId) return;
    setState({ saving: true });
    try{
      const rows = await fetchRecipeRowsIndexed();
      const target = rows.find(r => r.id === id);
      if(!target){
        console.error("VetriHub: editRecipe — id not found in sheet (may have been deleted elsewhere)", id);
        showToast("Couldn't find that recipe to update — it may have changed elsewhere.");
        setState({ saving: false });
        return;
      }
      const res = await fetch(`${recipesSheetsBase()}/values/Sheet1!A${target.rowNumber}:C${target.rowNumber}?valueInputOption=RAW`, {
        method: "PUT",
        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ range: `Sheet1!A${target.rowNumber}:C${target.rowNumber}`, majorDimension: "ROWS", values: [[id, name, instructions || ""]] })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: recipe row update failed", res.status, body);
        throw new Error("recipe row update failed: " + res.status);
      }
      state.recipes = state.recipes.map(r => r.id === id ? { ...r, name, instructions } : r);
      console.log("VetriHub: recipe row " + target.rowNumber + " updated");
      await refreshMirrorBestEffort();
    }catch(e){
      console.error("VetriHub: editRecipe error", e);
      showToast("Couldn't save recipe — check Errors log.");
    }
    setState({ saving: false });
  });
}

/* DELETE — find the one matching row, remove only that row via a dimension
   delete (shifts later rows up on Google's side; no full-sheet rewrite). */
function deleteRecipe(id){
  return queueRecipeOp(async () => {
    if(!state.accessToken || !state.recipesSheetId) return;
    setState({ saving: true });
    try{
      const rows = await fetchRecipeRowsIndexed();
      const target = rows.find(r => r.id === id);
      if(!target){
        console.error("VetriHub: deleteRecipe — id not found in sheet (may already be gone)", id);
        state.recipes = state.recipes.filter(r => r.id !== id);
        setState({ saving: false });
        return;
      }
      const res = await fetch(`${recipesSheetsBase()}:batchUpdate`, {
        method: "POST",
        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({
          requests: [{
            deleteDimension: {
              range: { sheetId: 0, dimension: "ROWS", startIndex: target.rowNumber - 1, endIndex: target.rowNumber }
            }
          }]
        })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: recipe row delete failed", res.status, body);
        throw new Error("recipe row delete failed: " + res.status);
      }
      state.recipes = state.recipes.filter(r => r.id !== id);
      console.log("VetriHub: recipe row " + target.rowNumber + " deleted");
      await refreshMirrorBestEffort();
    }catch(e){
      console.error("VetriHub: deleteRecipe error", e);
      showToast("Couldn't delete recipe — check Errors log.");
    }
    setState({ saving: false });
  });
}

function recipesToDocText(recipes){
  if(recipes.length === 0) return "";
  return recipes.map(r => `${r.name}\n---\n${r.instructions || ""}`).join("\n\n====\n\n");
}

/* Mirror is reference-only, so it re-reads the sheet fresh (rather than
   trusting in-memory state) right before writing — if it's ever a beat
   behind, that only affects the courtesy copy, never the real data. */
async function refreshMirrorBestEffort(){
  try{
    const rows = await fetchRecipeRowsIndexed();
    await syncRecipesDocMirror(rows);
  }catch(e){
    console.error("VetriHub: mirror refresh failed (non-fatal)", e);
    showToast("Recipe saved. Reference doc couldn't update — check Errors log.");
  }
}

async function syncRecipesDocMirror(recipes){
  if(!state.docId || !state.accessToken) return;
  // Whole-file replace via Drive's media upload — Google converts the plain
  // text into the Doc's content directly. No index math, nothing to desync.
  const text = recipesToDocText(recipes) || " "; // Drive rejects a fully empty upload
  const uploadRes = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${state.docId}?uploadType=media`, {
    method: "PATCH",
    headers: {
      Authorization: "Bearer " + state.accessToken,
      "Content-Type": "text/plain"
    },
    body: text
  });
  if(!uploadRes.ok){
    const body = await uploadRes.text();
    console.error("VetriHub: mirror doc upload failed", uploadRes.status, body);
    throw new Error("mirror doc upload failed: " + uploadRes.status);
  }
  console.log("VetriHub: mirror sync complete — " + recipes.length + " recipes written to doc");
}

/* =========================================================
   Situations & Solutions — public read, owner write.
   Same atomic-append / targeted-row pattern as Recipes.
   Content is stored as HTML (from the rich-text editor).
========================================================= */
function situationsSheetsBase(){ return `https://sheets.googleapis.com/v4/spreadsheets/${state.situationsSheetId}`; }

function rowsToSituations(rows){
  return (rows || [])
    .filter(r => r[1])
    .map(r => ({ id: r[0] || uid(), title: r[1] || "", content: r[2] || "" }));
}

async function loadSituationsPublic(){
  if(!state.situationsSheetId){
    setState({ situations: [], situationsLoading: false });
    return;
  }
  setState({ situationsLoading: true });
  try{
    const url = state.accessToken
      ? `${situationsSheetsBase()}/values/Sheet1!A2:C1000`
      : `${situationsSheetsBase()}/values/Sheet1!A2:C1000?key=${CONFIG.API_KEY}`;
    const res = await fetch(url, state.accessToken
      ? { headers: { Authorization: "Bearer " + state.accessToken }, cache: "no-store" }
      : { cache: "no-store" });
    if(!res.ok){
      const body = await res.text();
      console.error("VetriHub: Situations sheet read failed", res.status, body);
      throw new Error("situations sheet read failed: " + res.status);
    }
    const data = await res.json();
    state.situations = rowsToSituations(data.values);
    console.log("VetriHub: loadSituationsPublic loaded " + state.situations.length + " situations (signedIn=" + state.signedIn + ")");
  }catch(e){
    state.situations = state.situations || [];
    console.error("VetriHub: loadSituationsPublic error", e);
    showToast("Couldn't load Situations & Solutions — check Errors log.");
  }
  setState({ situationsLoading: false });
}

let situationOpQueue = Promise.resolve();
function queueSituationOp(fn){
  const run = situationOpQueue.then(fn, fn);
  situationOpQueue = run.catch(() => {});
  return run;
}

async function fetchSituationRowsIndexed(){
  const res = await fetch(`${situationsSheetsBase()}/values/Sheet1!A2:C1000`, {
    headers: { Authorization: "Bearer " + state.accessToken },
    cache: "no-store"
  });
  if(!res.ok){
    const body = await res.text();
    console.error("VetriHub: Situations sheet read failed", res.status, body);
    throw new Error("situations sheet read failed: " + res.status);
  }
  const data = await res.json();
  const rows = data.values || [];
  return rows
    .map((r, idx) => ({ rowNumber: idx + 2, id: r[0] || "", title: r[1] || "", content: r[2] || "" }))
    .filter(r => r.title);
}

function addSituation(title, content){
  return queueSituationOp(async () => {
    if(!state.accessToken || !state.situationsSheetId) return;
    setState({ saving: true });
    try{
      const situation = { id: uid(), title, content: content || "" };
      const res = await fetch(`${situationsSheetsBase()}/values/Sheet1!A2:C:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
        method: "POST",
        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ values: [[situation.id, situation.title, situation.content]] })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: situation append failed", res.status, body);
        throw new Error("situation append failed: " + res.status);
      }
      state.situations = [situation, ...state.situations];
      console.log("VetriHub: situation appended — now " + state.situations.length + " in memory");
    }catch(e){
      console.error("VetriHub: addSituation error", e);
      showToast("Couldn't save — check Errors log.");
    }
    setState({ saving: false });
  });
}

function editSituation(id, title, content){
  return queueSituationOp(async () => {
    if(!state.accessToken || !state.situationsSheetId) return;
    setState({ saving: true });
    try{
      const rows = await fetchSituationRowsIndexed();
      const target = rows.find(r => r.id === id);
      if(!target){
        console.error("VetriHub: editSituation — id not found in sheet", id);
        showToast("Couldn't find that item to update — it may have changed elsewhere.");
        setState({ saving: false });
        return;
      }
      const res = await fetch(`${situationsSheetsBase()}/values/Sheet1!A${target.rowNumber}:C${target.rowNumber}?valueInputOption=RAW`, {
        method: "PUT",
        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ range: `Sheet1!A${target.rowNumber}:C${target.rowNumber}`, majorDimension: "ROWS", values: [[id, title, content || ""]] })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: situation row update failed", res.status, body);
        throw new Error("situation row update failed: " + res.status);
      }
      state.situations = state.situations.map(s => s.id === id ? { ...s, title, content } : s);
      console.log("VetriHub: situation row " + target.rowNumber + " updated");
    }catch(e){
      console.error("VetriHub: editSituation error", e);
      showToast("Couldn't save — check Errors log.");
    }
    setState({ saving: false });
  });
}

function deleteSituation(id){
  return queueSituationOp(async () => {
    if(!state.accessToken || !state.situationsSheetId) return;
    setState({ saving: true });
    try{

        setState({ saving: false });

      const res = await fetch(`${situationsSheetsBase()}:batchUpdate`, {

        headers: { Authorization: "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({
          requests: [{
            deleteDimension: {
              range: { sheetId: 0, dimension: "ROWS", startIndex: target.rowNumber - 1, endIndex: target.rowNumber }
            }
          }]
        })
      });
      if(!res.ok){
        const body = await res.text();
        console.error("VetriHub: situation row delete failed", res.status, body);
        throw new Error("situation row delete failed: " + res.status);
      }
      state.situations = state.situations.filter(s => s.id !== id);
      console.log("VetriHub: situation row " + target.rowNumber + " deleted");
    }catch(e){

function computeRowsWithGaps(cyclesArr){
  const sorted = [...cyclesArr].sort((a,b) => {
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.time||"") < (a.time||"") ? -1 : 1;
  });
  return sorted.map((cyc, idx) => {
    const older = sorted[idx+1];
    const gap = older ? diffDays(cyc.date, older.date) : null;
    const expectedNext = gap != null ? addDays(cyc.date, gap) : null;
    return { ...cyc, gap, expectedNext };
  });
}

          <label for="situationTitleInput">Title</label>
          <input id="situationTitleInput" type="text" value="${esc(f.title || "")}" />
          ${f.error ? `<div class="vh-field-error">${esc(f.error)}</div>` : ""}
        </div>
        <div class="vh-field">
          <label>Content</label>
          ${RTE_TOOLBAR}
          <div class="vh-rte-editor" id="situationContentEditor" contenteditable="true" data-placeholder="Write here…">${f.content || ""}</div>
        </div>
        <div class="vh-modal-actions">
          <button class="vh-btn vh-btn-cancel" id="situationCancelBtn" ${state.saving ? "disabled" : ""}>Cancel</button>
          <button class="vh-btn vh-btn-save" id="situationSaveBtn" ${state.saving ? "disabled" : ""}>${state.saving ? "Saving…" : "Save"}</button>
        </div>
      </div>
    </div>`;
}

function confirmModal(message, kind){
  return `
    <div class="vh-modal-scrim" id="${kind}ConfirmScrim">
      <div class="vh-modal" id="${kind}ConfirmModal">
        <div class="vh-modal-title">Confirm delete</div>
        <div class="vh-confirm-text">${esc(message)}</div>
        <div class="vh-modal-actions">
          <button class="vh-btn vh-btn-cancel" id="${kind}ConfirmCancel" ${state.saving ? "disabled" : ""}>Cancel</button>
          <button class="vh-btn vh-btn-delete" id="${kind}ConfirmDelete" ${state.saving ? "disabled" : ""}>Delete</button>
        </div>
      </div>
    </div>`;
}

/* =========================================================
   Event binding
========================================================= */
function bindEvents(){
  const $ = (id) => document.getElementById(id);

  $("burgerBtn")?.addEventListener("click", () => setState({ drawerOpen: true }));
  $("scrim")?.addEventListener("click", () => setState({ drawerOpen: false }));
  document.querySelectorAll("[data-nav]").forEach(el =>
    el.addEventListener("click", () => {
      if(el.dataset.nav === "cycle-home"){
        if(!state.signedIn){ setState({ drawerOpen: false }); return; }
        sessionStorage.setItem("vetrihub_screen", "cycle");
        setState({ screen: "cycle", drawerOpen: false });
        return;
      }
      sessionStorage.setItem("vetrihub_screen", el.dataset.nav);
      setState({ screen: el.dataset.nav, drawerOpen: false });
    })
  );

  $("authBtn")?.addEventListener("click", () => { state.signedIn ? signOut() : signIn(); });

  // Cycle
  $("addCycleBtn")?.addEventListener("click", () => { if(state.saving) return; setState({ cycleForm: { mode: "add", date: "", time: "", error: "" } }); });
  document.querySelectorAll("[data-edit-cycle]").forEach(el =>
    el.addEventListener("click", () => {
      if(state.saving) return;
      const c = state.cycles.find(x => x.id === el.dataset.editCycle);
      if(c) setState({ cycleForm: { mode: "edit", id: c.id, date: c.date, time: c.time || "", error: "" } });
    })
  );
  document.querySelectorAll("[data-delete-cycle]").forEach(el =>
    el.addEventListener("click", () => { if(state.saving) return; setState({ cycleDeleteId: el.dataset.deleteCycle }); })
  );
  $("cycleModalScrim")?.addEventListener("click", (e) => { if(e.target.id === "cycleModalScrim") setState({ cycleForm: null }); });
  $("cycleCancelBtn")?.addEventListener("click", () => setState({ cycleForm: null }));
  $("cycleSaveBtn")?.addEventListener("click", async () => {
    if(state.saving) return;
    const date = $("cycleDateInput").value;
    const time = $("cycleTimeInput").value;
    if(!date){ setState({ cycleForm: { ...state.cycleForm, date, time, error: "Cycle date is required." } }); return; }
    const formSnapshot = state.cycleForm;
    const next = formSnapshot.mode === "edit"
      ? state.cycles.map(c => c.id === formSnapshot.id ? { ...c, date, time } : c)
      : [...state.cycles, { id: uid(), date, time }];
    setState({ cycleForm: null });
    await saveCyclesToSheet(next);
    render();
  });
  $("cycleConfirmCancel")?.addEventListener("click", () => setState({ cycleDeleteId: null }));
  $("cycleConfirmDelete")?.addEventListener("click", async () => {
    if(state.saving) return;
    const idToDelete = state.cycleDeleteId;
    const next = state.cycles.filter(c => c.id !== idToDelete);
    setState({ cycleDeleteId: null });
    await saveCyclesToSheet(next);
    render();
  });
  $("cycleConfirmScrim")?.addEventListener("click", (e) => { if(e.target.id === "cycleConfirmScrim") setState({ cycleDeleteId: null }); });

  // Recipe
  $("pendingFilterBtn")?.addEventListener("click", () => {
    setState({ recipeViewFilter: state.recipeViewFilter === "pending" ? "all" : "pending" });
  });
  $("addRecipeBtn")?.addEventListener("click", () => {
    if(state.saving) return;
    setState({ bulkAddMode: false, recipeForm: { mode: "add", name: "", instructions: "", error: "" } });
  });
  document.querySelectorAll("[data-edit-recipe]").forEach(el =>
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if(state.saving) return;
      const r = state.recipes.find(x => x.id === el.dataset.editRecipe);
      if(r) setState({ bulkAddMode: false, recipeForm: { mode: "edit", id: r.id, name: r.name, instructions: r.instructions, error: "" } });
    })
  );
  document.querySelectorAll("[data-delete-recipe]").forEach(el =>
    el.addEventListener("click", (e) => { e.stopPropagation(); if(state.saving) return; setState({ recipeDeleteId: el.dataset.deleteRecipe }); })
  );
  document.querySelectorAll("[data-toggle-recipe]").forEach(el =>
    el.addEventListener("click", () => {
      const id = el.dataset.toggleRecipe;
      setState({ recipeExpandedId: state.recipeExpandedId === id ? null : id });
    })
  );
  $("recipeSearchInput")?.addEventListener("input", (e) => {
    state.recipeQuery = e.target.value;
    render();
    $("recipeSearchInput").focus();
    $("recipeSearchInput").selectionStart = $("recipeSearchInput").selectionEnd = state.recipeQuery.length;
  });
  $("recipeModalScrim")?.addEventListener("click", (e) => { if(e.target.id === "recipeModalScrim") setState({ recipeForm: null }); });
  $("recipeCancelBtn")?.addEventListener("click", () => {
    if(state.recipeForm && state.recipeForm.mode === "edit"){ setState({ recipeForm: null }); return; }
    // "Add multiple instead" — switch to bulk mode, keep the modal open
    setState({ bulkAddMode: true, recipeForm: { mode: "add", bulkText: "", error: "" } });
  });
  $("recipeSaveBtn")?.addEventListener("click", async () => {
    if(state.saving) return;
    const name = $("recipeNameInput").value.trim();
    const instructions = $("recipeInstrInput").value.trim();
    if(!name){ setState({ recipeForm: { ...state.recipeForm, name, instructions, error: "Recipe name is required." } }); return; }
    const formSnapshot = state.recipeForm;
    setState({ recipeForm: null });
    if(formSnapshot.mode === "edit"){
      await editRecipe(formSnapshot.id, name, instructions);
    } else {
      await addRecipe(name, instructions);
    }
    render();
  });
  $("bulkAddSwitchBtn")?.addEventListener("click", () => {
    setState({ bulkAddMode: false, recipeForm: { mode: "add", name: "", instructions: "", error: "" } });
  });
  $("bulkAddSaveBtn")?.addEventListener("click", async () => {
    if(state.saving) return;
    const text = $("bulkAddInput").value;
    const entries = parseBulkRecipeText(text);
    if(entries.length === 0){ setState({ recipeForm: { ...state.recipeForm, bulkText: text, error: "Add at least one recipe (a title on its own line)." } }); return; }
    setState({ recipeForm: null, bulkAddMode: false });
    await addRecipesBulk(entries);
    render();
  });
  $("recipeConfirmCancel")?.addEventListener("click", () => setState({ recipeDeleteId: null }));
  $("recipeConfirmDelete")?.addEventListener("click", async () => {
    if(state.saving) return;
    const idToDelete = state.recipeDeleteId;
    setState({ recipeDeleteId: null });
    await deleteRecipe(idToDelete);
    render();
  });
  $("recipeConfirmScrim")?.addEventListener("click", (e) => { if(e.target.id === "recipeConfirmScrim") setState({ recipeDeleteId: null }); });

  // Situations & Solutions
  $("addSituationBtn")?.addEventListener("click", () => {
    if(state.saving) return;
    setState({ situationForm: { mode: "add", title: "", content: "", error: "" } });
  });
  document.querySelectorAll("[data-edit-situation]").forEach(el =>
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if(state.saving) return;
      const s = state.situations.find(x => x.id === el.dataset.editSituation);
      if(s) setState({ situationForm: { mode: "edit", id: s.id, title: s.title, content: s.content, error: "" } });
    })
  );
  document.querySelectorAll("[data-delete-situation]").forEach(el =>
    el.addEventListener("click", (e) => { e.stopPropagation(); if(state.saving) return; setState({ situationDeleteId: el.dataset.deleteSituation }); })
  );
  document.querySelectorAll("[data-toggle-situation]").forEach(el =>
    el.addEventListener("click", () => {
      const id = el.dataset.toggleSituation;
      setState({ situationExpandedId: state.situationExpandedId === id ? null : id });
    })
  );
  $("situationSearchInput")?.addEventListener("input", (e) => {
    state.situationQuery = e.target.value;
    render();
    $("situationSearchInput").focus();
    $("situationSearchInput").selectionStart = $("situationSearchInput").selectionEnd = state.situationQuery.length;
  });

  // Rich-text toolbar — mousedown+preventDefault keeps the editor's text
  // selection alive so the command applies where the cursor actually is.
  const rteEditor = $("situationContentEditor");
  document.querySelectorAll(".vh-rte-btn").forEach(btn => {
    btn.addEventListener("mousedown", (e) => e.preventDefault());
    btn.addEventListener("click", () => {
      rteEditor?.focus();
      const cmd = btn.dataset.cmd;
      const value = btn.dataset.value || null;
      document.execCommand(cmd, false, value);
    });
  });
  $("rteHeadingSelect")?.addEventListener("mousedown", (e) => e.stopPropagation());
  $("rteHeadingSelect")?.addEventListener("change", (e) => {
    rteEditor?.focus();
    document.execCommand("formatBlock", false, e.target.value);
  });

  $("situationModalScrim")?.addEventListener("click", (e) => { if(e.target.id === "situationModalScrim") setState({ situationForm: null }); });
  $("situationCancelBtn")?.addEventListener("click", () => setState({ situationForm: null }));
  $("situationSaveBtn")?.addEventListener("click", async () => {
    if(state.saving) return;
    const title = $("situationTitleInput").value.trim();
    const content = $("situationContentEditor").innerHTML.trim();
    if(!title){ setState({ situationForm: { ...state.situationForm, title, content, error: "Title is required." } }); return; }
    const formSnapshot = state.situationForm;
    setState({ situationForm: null });
    if(formSnapshot.mode === "edit"){
      await editSituation(formSnapshot.id, title, content);
    } else {
      await addSituation(title, content);
    }
    render();
  });
  $("situationConfirmCancel")?.addEventListener("click", () => setState({ situationDeleteId: null }));
  $("situationConfirmDelete")?.addEventListener("click", async () => {
    if(state.saving) return;
    const idToDelete = state.situationDeleteId;
    setState({ situationDeleteId: null });
    await deleteSituation(idToDelete);
    render();
  });
  $("situationConfirmScrim")?.addEventListener("click", (e) => { if(e.target.id === "situationConfirmScrim") setState({ situationDeleteId: null }); });
}

/* =========================================================
   Boot
========================================================= */
boot();
window.addEventListener("load", () => {
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
});
</script>
</body>
</html>
